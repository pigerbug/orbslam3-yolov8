%YAML:1.0
# Optional MD-SLAM dynamic-scene front end.  Set enabled to 1 only after
# exporting a fixed-shape YOLOv8 COCO detection engine (one CHW input and one
# [1,84,N] or [1,N,84] output) with TensorRT.
DynamicFilter:
  enabled: 0
  engine: "model/yolov8n.engine"
  # Default: retain all ORB features and downweight points inside a YOLO box.
  # Set to 1 only to restore the old feature-extraction hard mask.
  hardMask: 0
  yoloPrior: 0.70
  # Features at or above this probability cannot create persistent MapPoints.
  dynamicThreshold: 0.55
  # Maximum main-thread wait for the matching detector result. A result from a
  # different frame is never reused; 0 means no wait.
  resultWaitMs: 10
  # RGB-D only: in metres, used for orthogonal-plane immunity.
  planeDistance: 0.05
