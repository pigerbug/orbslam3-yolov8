%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 535.4
Camera1.fy: 539.2
Camera1.cx: 320.1
Camera1.cy: 247.6

Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0
Stereo.b: 0.0747

# Depth map values factor
RGBD.DepthMapFactor: 5000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

# Dynamic-scene front end. Keep these extension parameters separate from the
# official fr3 calibration above.
DynamicFilter:
  enabled: 1
  engine: "/home/nan/workspace/orbslam3-yolov8/models/yolov8n.engine"
  hardMask: 1
  sampsonEnabled: 1
  # Set to 1 for probability analysis. With hardMask: 1, masked features do
  # not exist in the log; create this directory before running.
  dumpProbabilities: 0
  probabilityDumpPath: "/home/nan/workspace/orbslam3-yolov8/logs"
  yoloPrior: 0.70
  planeDistance: 0.05

# Only when hard-mask tracking is starved, use RGB-D to reopen pixels that
# are clearly behind the dynamic foreground. They are treated as background.
DynamicRecovery:
  enabled: 0
  minStaticMapMatches: 60
  backgroundDepthGap: 0.15

# Conservative ground-contact shadow probability; set enabled: 0 to restore
# the pre-shadow baseline.
GroundShadow:
  enabled: 1
  prior: 0.45
  planeDistance: 0.08
  radius: 0.35
  brightnessDiff: 12.0
  textureStd: 18.0
  geometryThreshold: 0.10

# Master switch for persistent Manhattan plane extraction, plane immunity and
# plane BA.  This must be disabled for the no-plane ablation baseline.
ManhattanPlane:
  enabled: 1

# Master switch for LSD/LBD extraction and MapLine construction.
LineFeature:
  enabled: 1

LineBA:
  enabled: 1
  minStaticPointEdges: 150

PlaneBA:
  enabled: 1

# Disabled for this textured TUM sequence because the ablation increased ATE.
LineTracking:
  enabled: 0
  maxStaticPoints: 80

