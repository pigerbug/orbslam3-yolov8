%YAML:1.0

# Bonn RGB-D Dynamic Dataset configuration.
# Official RGB calibration:
# https://www.ipb.uni-bonn.de/data/rgbd-dynamic-dataset/index.html
File.version: "1.0"

Camera.type: "PinHole"
Camera1.fx: 542.822841
Camera1.fy: 542.576870
Camera1.cx: 315.593520
Camera1.cy: 237.756098

# Bonn publishes OpenCV distortion coefficients d0..d4.  They map to
# k1, k2, p1, p2, k3 respectively.
Camera1.k1: 0.039903
Camera1.k2: -0.099343
Camera1.p1: -0.000730
Camera1.p2: -0.000144
Camera1.k3: 0.000000

Camera.width: 640
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

# RGB-D depth is already registered to color.  The 16-bit depth PNGs follow
# the TUM-compatible convention (metric_depth = stored_value / 5000).
# Stereo.b/bf only defines the close/far observation threshold in RGB-D mode.
Stereo.ThDepth: 40.0
Stereo.b: 0.0747
RGBD.DepthMapFactor: 5000.0

ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

# Dynamic feature front end.  Update engine to the TensorRT engine generated
# for the GPU used for the experiment.
DynamicFilter:
  enabled: 1
  engine: "/home/nan/workspace/orbslam3-yolov8/models/yolov8n.engine"
  # All YOLO candidate instances are masked from the main ORB front end.
  hardMask: 1
  sampsonEnabled: 1
  dynamicThreshold: 0.55
  yoloPrior: 0.70
  # Benchmark mode: wait for the exact current-frame TensorRT result instead
  # of silently treating a 10 ms scheduling timeout as an empty detection.
  # This improves repeatability of the asynchronous frontend on crowd data.
  resultWaitMs: 50
  planeDistance: 0.05
  dumpProbabilities: 0
  probabilityDumpPath: "/home/nan/workspace/orbslam3-yolov8/logs"

DynamicRecovery:
  # A close person has substantial depth variation across its own body; a
  # box-level depth split would incorrectly re-admit moving body features.
  # Keep this off for Bonn crowd sequences.
  enabled: 0
  minStaticMapMatches: 60
  backgroundDepthGap: 0.15
  # Recovered box-interior background may assist only the current pose at a
  # reduced weight after static-map/depth validation; it is barred from new
  # landmark/keyframe observations.
  poseProbability: 0.45
  mapDepthResidual: 0.10

# YOLO classes are only candidate regions; the probe state machine determines
# whether an instance is actually static or dynamic.
InstanceMotion:
  enabled: 1
  # Fewer than eight current-frame 3-D matches leaves the instance Unknown.
  # It is never released using stale Static evidence.
  minMatches: 8
  staticRatio: 0.70
  reprojectionResidual: 5.0
  depthResidual: 0.10
  staticProbability: 0.10
  # Full main-front-end/map release is stricter than Probe-Static: six
  # consecutive supported frames and at least 12 current 3-D matches.
  releaseFrames: 6
  releaseMinMatches: 12
  # Dense crowds may make several people move coherently with the camera.
  # Do not promote any instance to normal MapPoints in such frames.
  maxPromotionCoverage: 0.35

# Recover existing, well-observed static MapPoints only when their projected
# depth and a box-internal probe both agree with the current RGB-D image.
# These are temporary pose constraints, never new observations or landmarks.
TrustedMapRecovery:
  enabled: 1
  minStaticMatches: 20
  maxConstraints: 20
  reprojectionResidual: 3.0
  depthResidual: 0.03

# Pure RGB-D fallback for full or near-full occlusion.  Unknown coherent
# motion is identified from disagreement with the pose predicted from the
# existing static map; map growth is frozen until static support returns.
OcclusionMode:
  # Crowd2 repeatedly satisfies the semantic-coverage trigger although the
  # camera is still moving.  Holding the predicted pose for up to ten frames
  # creates large saw-tooth ATE errors; keep this experimental fallback off
  # for the Bonn benchmarks.
  enabled: 0
  minStaticMatches: 20
  minUnknownMatches: 20
  unknownFraction: 0.60
  depthResidual: 0.12
  reprojectionResidual: 12.0
  semanticCoverage: 0.70
  recoveryFrames: 3
  holdOnSuddenLoss: 0
  maxHoldFrames: 10

# Reject an apparently successful local-map pose when it makes a large
# inter-frame jump without enough static-map support.  This protects ATE and
# map growth from the brief crowd-induced wrong-association branches.
PoseGuard:
  enabled: 1
  maxTranslation: 0.06
  maxRotationDeg: 12.0
  minStaticInliers: 45

GroundShadow:
  enabled: 1
  prior: 0.45
  planeDistance: 0.08
  radius: 0.35
  brightnessDiff: 12.0
  textureStd: 18.0
  geometryThreshold: 0.10

ManhattanPlane:
  enabled: 1

PlaneBA:
  enabled: 1

LineFeature:
  enabled: 1

LineInitialization:
  enabled: 1
  minStaticPoints: 120
  minDepthLines: 12
  minLineLength: 30.0

LineBA:
  enabled: 1
  minStaticPointEdges: 150

# Keep disabled for the primary dynamic comparison.  Enable only for the
# low-texture structural ablation after a MapLine map has been established.
LineTracking:
  enabled: 0
  maxStaticPoints: 80
